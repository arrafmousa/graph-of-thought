name: policy

on:
  push:
  pull_request:

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Repository architecture validation
        run: python scripts/validate_repo.py
      - name: Tests
        run: python -m pytest -q
      - name: Representative run
        run: python scripts/run.py --config configs/run_pipeline/demo/synthetic_workload_smoke.json
      - name: Validate run artifacts
        run: |
          latest=$(ls -dt output/*/ | head -1)
          python scripts/validate_run.py "$latest"
